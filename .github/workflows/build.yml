name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version, e.g. 0.1.0 (leave empty to only build and test)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MicSwitcher.sln

      - name: Build
        run: dotnet build MicSwitcher.sln -c Release --no-restore

      - name: Test
        run: dotnet test MicSwitcher.sln -c Release --no-build --verbosity normal --logger GitHubActions

      - name: Publish single-file executable
        run: >
          dotnet publish src/MicSwitcher.App/MicSwitcher.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MicSwitcher-win-x64
          path: publish/MicSwitcher.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "v" + "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $tag = "${{ github.ref_name }}"
          }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # The release already exists; just attach this build.
            gh release upload $tag publish/MicSwitcher.exe --clobber
          } else {
            $flags = @()
            if ($tag -like "v0.*") { $flags += "--prerelease" }
            # --target makes GitHub create the tag at this commit when it does not exist yet.
            gh release create $tag publish/MicSwitcher.exe --target "${{ github.sha }}" --generate-notes --title "MicSwitcher $tag" @flags
          }

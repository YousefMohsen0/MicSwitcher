name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MicSwitcher.sln

      - name: Build
        run: dotnet build MicSwitcher.sln -c Release --no-restore

      - name: Test
        run: dotnet test MicSwitcher.sln -c Release --no-build --verbosity normal

      - name: Publish single-file executable
        run: >
          dotnet publish src/MicSwitcher.App/MicSwitcher.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MicSwitcher-win-x64
          path: publish/MicSwitcher.exe

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/MicSwitcher.exe --generate-notes

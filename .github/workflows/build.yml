name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version, e.g. 0.1.0 (leave empty to only build and test)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MicSwitcher.sln

      - name: Build
        run: dotnet build MicSwitcher.sln -c Release --no-restore

      - name: Test
        run: dotnet test MicSwitcher.sln -c Release --no-build --verbosity normal --logger GitHubActions

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.version }}" -ne "") {
            $v = "${{ github.event.inputs.version }}".TrimStart("v")
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = ([xml](Get-Content src/MicSwitcher.App/MicSwitcher.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained folder)
        run: >
          dotnet publish src/MicSwitcher.App/MicSwitcher.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Sign the app (only when a certificate is configured)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host "No code-signing certificate configured; skipping."; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $tool.FullName sign /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\MicSwitcher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir="${{ github.workspace }}\publish"
          installer\MicSwitcher.iss

      - name: Sign the installer (only when a certificate is configured)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { Write-Host "No code-signing certificate configured; skipping."; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $tool.FullName sign /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\MicSwitcher-Setup-${{ steps.ver.outputs.version }}.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MicSwitcher-Setup
          path: dist/MicSwitcher-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "v" + "${{ github.event.inputs.version }}".TrimStart("v")
          } else {
            $tag = "${{ github.ref_name }}"
          }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # The release already exists; just attach this build.
            gh release upload $tag dist/MicSwitcher-Setup-${{ steps.ver.outputs.version }}.exe --clobber
          } else {
            $flags = @()
            if ($tag -like "v0.*") { $flags += "--prerelease" }
            # --target makes GitHub create the tag at this commit when it does not exist yet.
            gh release create $tag dist/MicSwitcher-Setup-${{ steps.ver.outputs.version }}.exe --target "${{ github.sha }}" --generate-notes --title "MicSwitcher $tag" @flags
          }

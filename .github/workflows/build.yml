name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MicSwitcher.sln

      - name: Build
        run: dotnet build MicSwitcher.sln -c Release --no-restore

      - name: Test
        run: dotnet test MicSwitcher.sln -c Release --no-build --verbosity normal --logger GitHubActions

      - name: Publish single-file executable
        run: >
          dotnet publish src/MicSwitcher.App/MicSwitcher.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MicSwitcher-win-x64
          path: publish/MicSwitcher.exe

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # The release was created first (e.g. from the GitHub UI); just attach the build.
            gh release upload $tag publish/MicSwitcher.exe --clobber
          } else {
            $flags = @()
            if ($tag -like "v0.*") { $flags += "--prerelease" }
            gh release create $tag publish/MicSwitcher.exe --generate-notes --title "MicSwitcher $tag" @flags
          }
